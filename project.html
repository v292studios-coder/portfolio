<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse project details and photo galleries by photographer Vishnu Kumar.">
    <title>Project Details | 292 Studios</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
    
    <style>
        /* Project Page Specific Styling */
        .project-header-section {
            padding: 8rem 0 4rem 0;
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent-gold);
            text-decoration: none;
            font-family: var(--font-heading);
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            transition: var(--transition-fast);
        }
        
        .back-link:hover {
            color: var(--accent-gold-hover);
            transform: translateX(-4px);
        }
        
        .back-link .arrow-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
            transition: transform 0.2s ease;
        }
        
        .project-detail-meta {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1rem;
            font-family: var(--font-heading);
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-gold);
            font-weight: 500;
        }
        
        .project-detail-meta span:not(:last-child)::after {
            content: "·";
            margin-left: 1.5rem;
            color: var(--text-muted);
        }
        
        .project-detail-title {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }
        
        .project-detail-desc {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-secondary);
            font-weight: 300;
            max-width: 800px;
        }
        
        .project-gallery-section {
            padding: 4rem 0 8rem 0;
            background-color: var(--bg-secondary);
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        @media (max-width: 1024px) {
            .project-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
            }
            .project-detail-title {
                font-size: 2rem;
            }
        }

        @media (max-width: 768px) {
            .project-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .project-header-section {
                padding: 6rem 0 3rem 0;
            }
            .project-detail-title {
                font-size: 1.75rem;
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>
    <!-- Custom Loading Cover -->
    <div id="loader" class="loader-container">
        <div class="loader-bar"></div>
    </div>

    <!-- Header & Navigation -->
    <header class="main-header scrolled" id="header">
        <div class="header-container">
            <a href="index.html" class="logo" id="logo-link">
                <span class="logo-name">292 STUDIOS</span>
                <span class="logo-subtitle">BY VISHNU KUMAR</span>
            </a>
            
            <nav class="nav-menu" id="nav-menu">
                <ul class="nav-list">
                    <li class="nav-item"><a href="index.html#gallery" class="nav-link">Work</a></li>
                    <li class="nav-item"><a href="index.html#about" class="nav-link">About</a></li>
                    <li class="nav-item"><a href="index.html#contact" class="nav-link">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Project Header Section -->
    <section class="project-header-section">
        <div class="container">
            <a href="index.html#gallery" class="back-link">
                <svg viewBox="0 0 24 24" class="arrow-icon"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                Back to portfolio
            </a>
            <div class="project-detail-meta">
                <span id="proj-category">Category</span>
                <span id="proj-location">Location</span>
            </div>
            <h1 class="project-detail-title" id="proj-title">Project Name</h1>
            <p class="project-detail-desc" id="proj-desc">Project description goes here.</p>
        </div>
    </section>

    <!-- Project Gallery Grid Section -->
    <section class="project-gallery-section">
        <div class="container">
            <div class="project-grid" id="project-grid">
                <!-- Dynamically loaded gallery items -->
            </div>
        </div>
    </section>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
        <button class="lightbox-close" id="lightbox-close" aria-label="Close Lightbox">&times;</button>
        
        <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous Image">
            <svg viewBox="0 0 24 24" class="svg-icon"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        
        <div class="lightbox-content-wrapper">
            <img src="" alt="" class="lightbox-img" id="lightbox-img" draggable="false">
            <div class="lightbox-caption" id="lightbox-caption">
                <div class="caption-details">
                    <span class="caption-cat" id="lightbox-cat">Category</span>
                    <h4 class="caption-title" id="lightbox-title">Image Name</h4>
                    <p class="caption-loc" id="lightbox-loc">Location</p>
                </div>
                <div class="exif-data">
                    <span class="exif-tag" id="exif-cam">Sony A7R V</span>
                    <span class="exif-tag" id="exif-lens">85mm</span>
                    <span class="exif-tag" id="exif-settings">f/1.4 · 1/200s · ISO 100</span>
                </div>
            </div>
        </div>
        
        <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next Image">
            <svg viewBox="0 0 24 24" class="svg-icon"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="footer-copyright">&copy; 2026 292 Studios. All rights reserved.</p>
            <div class="footer-links">
                <a href="index.html" class="footer-link">Back to Home</a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="project-detail.js"></script>
</body>
</html>
